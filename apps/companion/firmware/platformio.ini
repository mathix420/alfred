; =============================================================================
; Alfred companion — firmware build configuration (PlatformIO + ESP-IDF)
; =============================================================================
;
; Target board: Waveshare ESP32-S3-Touch-AMOLED-1.8
;   - ESP32-S3R8 (dual-core LX7 @240MHz, 16MB NOR flash, 8MB OCTAL PSRAM)
;   - 1.8" AMOLED 368x448 over QSPI, capacitive touch over I2C
;   - ES8311 audio codec (I2S), QMI8658 IMU, PCF85063 RTC, AXP2101 PMIC, microSD
;
; There is no PlatformIO board file for this exact Waveshare module, so we build
; against the generic `esp32-s3-devkitc-1` board (same MCU/family) and pin the
; flash size, PSRAM and partition table explicitly below + in sdkconfig.defaults.
;
; ----------------------------------------------------------------------------
; BOARD REVISION (V1 vs V2)  — IMPORTANT
; ----------------------------------------------------------------------------
; Waveshare ships two hardware revisions of this module that differ ONLY in the
; display + touch controllers. `BOARD_VERSION` selects which driver the firmware
; compiles in (see src/board/*):
;
;   BOARD_VERSION=1  -> display SH8601   + touch FT3168
;   BOARD_VERSION=2  -> display CO5300   + touch CST816
;
; Default is V2 (the currently shipping revision). To build for a V1 unit, either
; flip the build flag below or build the `companion_v1` env:
;     pio run -e companion_v1
; TODO(hw): confirm your physical board revision before flashing (SCOPE.md §7).
; =============================================================================

[platformio]
; Default env built by a bare `pio run`.
default_envs = companion_v1
; Main-component sources live in src/ (registered by src/CMakeLists.txt via
; idf_component_register). Leave src_dir at its default `src` — pointing it at
; the project root ("." ) makes PlatformIO register the root *as a component*
; and then `include()` the project-level CMakeLists.txt during ESP-IDF's
; script-mode requirement scan, recursing into project.cmake/kconfig and
; aborting with "define_property command is not scriptable".
src_dir = src

; -----------------------------------------------------------------------------
; Shared options — every concrete env below pulls these in via `extends`.
; -----------------------------------------------------------------------------
[env]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1

; The S3R8 module: 16MB flash, 8MB OCTAL PSRAM. The detailed kconfig (PSRAM
; mode/speed, FreeRTOS HZ, FATFS, BLE, …) lives in sdkconfig.defaults.
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; The esp32-s3-devkitc-1 board manifest defaults to an 8MB part. Our module is
; 16MB — without this override PlatformIO sizes the partition check against 8MB
; and aborts ("Partitions ... does not fit in configured flash size 8MB"), and
; caps the upload size at 8MB. board_build.flash_size above only fixes the IDF
; sdkconfig; these fix PlatformIO's own partition/upload accounting.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Serial monitor: decode panic backtraces into file:line automatically.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; LVGL 9.x for the UI. Pinned to the v9 major. A starter LVGL config lives at
; src/lv_conf.h (LVGL 9.5 template, RGB565); the UI workstream owns its tuning.
; TODO(hw): if LVGL is vendored as an ESP-IDF component instead, drop this dep
; and register it via the component manager (idf_component.yml) instead.
lib_deps =
  lvgl/lvgl@^9.2.0

; Common compile flags shared by both board revisions.
build_flags =
  -DLV_CONF_INCLUDE_SIMPLE
  ; lv_conf.h lives in src/. The main component already has src/ on its include
  ; path, but the LVGL library (compiled separately from lib_deps) needs src/ on
  ; its path too to resolve the LV_CONF_INCLUDE_SIMPLE `#include "lv_conf.h"`.
  -I src
  ; Mirror PROTOCOL_VERSION from apps/pocket/src/types.ts — keep in lockstep.
  -DALFRED_PROTOCOL_VERSION=2

; -----------------------------------------------------------------------------
; Primary env: current shipping hardware (V2 — CO5300 / CST816).
; -----------------------------------------------------------------------------
[env:companion]
extends = env
build_flags =
  ${env.build_flags}
  -DBOARD_VERSION=2

; -----------------------------------------------------------------------------
; Legacy hardware (V1 — SH8601 / FT3168). Build with: pio run -e companion_v1
; -----------------------------------------------------------------------------
[env:companion_v1]
extends = env
build_flags =
  ${env.build_flags}
  -DBOARD_VERSION=1
