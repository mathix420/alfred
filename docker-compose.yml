# Neo4j 5 LTS — Alfred's self-hosted "second brain" (graph + native vector index).
# Single-user home server. Data is precious: see scripts/neo4j-backup.sh.
#
#   cp .env.example .env   # then set NEO4J_AUTH / ALFRED_NEO4J_* to a real password
#   docker compose up -d
#   open http://localhost:7474   (Neo4j Browser — visualize the brain)
services:
  neo4j:
    image: neo4j:5 # 5 LTS (supported into 2027). Pin a patch (e.g. neo4j:5.26) in prod.
    container_name: alfred-neo4j
    restart: unless-stopped
    ports:
      # Loopback ONLY: Community ships no wire encryption / rate-limiting. Reach it
      # over an SSH tunnel / VPN / TLS reverse proxy. Never publish to 0.0.0.0.
      - "127.0.0.1:7474:7474" # HTTP — Neo4j Browser UI
      - "127.0.0.1:7687:7687" # Bolt — driver / cypher-shell
    environment:
      # Seeds the initial user on FIRST boot only. Keep in sync with ALFRED_NEO4J_*.
      NEO4J_AUTH: "${NEO4J_AUTH:?set NEO4J_AUTH=neo4j/<password> in .env}"
      # Memory: heap initial == max avoids GC pauses from resizing. Tune to host RAM.
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
      # Native vector index needs no plugin. APOC is optional but handy for ETL.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # neo4j-admin database dump writes here (mounted to ./scripts).
      NEO4J_server_directories_dumps: "/backups"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
      - ./scripts:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
